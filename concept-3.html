<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сцена — концепция 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Сцена: тёмный зал, работа в луче света. Первый экран — сцена со сменой проектов и афишей справа,
   дальше — крупные кадры в шахматном порядке; кейс собран как разворот: текст стоит, кадры идут. */
:root{
  --stage:#0B0B0D; --wing:#151517; --rail:rgba(239,234,224,.16); --light:#EFEAE0; --dim:#98948B; --spot:#FFC20E;
  --serif:'Cormorant','Cormorant Garamond','Times New Roman',serif;
  --ui:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --gut:max(clamp(16px,3.4vw,56px),env(safe-area-inset-left,0px));
  --gutr:max(clamp(16px,3.4vw,56px),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stage);color:var(--light);font:300 17px/1.55 var(--ui);overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--spot);outline-offset:3px}
.wrap{padding-left:var(--gut);padding-right:var(--gutr)}
.cap{font:400 12px/1.3 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.pbar{background:#1b1b1f;color:#b9b9c2;font:500 12px/1.2 system-ui,sans-serif;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;padding-block:8px;position:relative;z-index:31}
.pbar a{color:#fff;text-decoration:none;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pbar a:hover{background:#34343b}.pbar a[aria-current]{background:#fff;color:#111}.pbar .sp{margin-left:auto}

.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:64px;margin-bottom:-64px;display:flex;align-items:center;gap:28px;background:linear-gradient(rgba(11,11,13,.82),rgba(11,11,13,0));transition:background .3s}
.hd.solid{background:rgba(11,11,13,.9);backdrop-filter:blur(10px)}
.hd .id{font:400 15px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;text-decoration:none}
.hd .id em{font-style:normal;color:var(--dim);margin-left:14px;letter-spacing:.14em;font-size:12px}
.hd nav{margin-left:auto;display:flex;gap:30px}
.hd nav a{font:400 13px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:8px 0;position:relative}
.hd nav a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;border-top:1px solid var(--spot);transition:right .3s}
.hd nav a:hover::after{right:0}

/* сцена */
.stg{position:relative;height:clamp(560px,calc(100vh - 34px),940px);overflow:hidden;background:var(--stage)}
.stg .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.stg .sl img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.stg .sl.on{opacity:1}.stg .sl.on img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.stg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(11,11,13,.93) 0,rgba(11,11,13,.7) 34%,rgba(11,11,13,.14) 66%,rgba(11,11,13,.6) 100%),linear-gradient(0deg,var(--stage) 0,rgba(11,11,13,0) 30%)}
.stg .tx{position:absolute;left:var(--gut);bottom:clamp(74px,11vh,120px);z-index:2;max-width:min(62vw,860px)}
.stg .no{display:flex;align-items:center;gap:14px;margin-bottom:clamp(10px,2vh,22px)}
.stg .no i{width:44px;border-top:1px solid var(--spot)}
.stg h1{margin:0;font:italic 400 clamp(54px,9.4vw,158px)/.9 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.stg h1.long{font-size:clamp(46px,6.6vw,112px)}
.stg p{margin:clamp(12px,2vh,22px) 0 clamp(18px,3vh,30px);font-size:clamp(17px,1.5vw,22px);max-width:30em;color:#d9d4c9}
.go{display:inline-flex;align-items:center;gap:14px;font:400 13px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--spot)}
.go b{font-weight:400;transition:transform .3s}.go:hover b{transform:translateX(6px)}
.stg .tx.sw>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}.stg .tx.sw>:nth-child(2){animation-delay:.06s}.stg .tx.sw>:nth-child(3){animation-delay:.12s}.stg .tx.sw>:nth-child(4){animation-delay:.18s}
@keyframes up{from{opacity:.01;transform:translateY(18px)}to{opacity:1;transform:none}}
.bill{position:absolute;right:var(--gutr);top:50%;transform:translateY(-50%);z-index:2;list-style:none;margin:0;padding:0;text-align:right}
.bill a{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:9px 0;text-decoration:none;font:400 13px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:rgba(239,234,224,.55);transition:color .3s}
.bill a::after{content:"";width:14px;border-top:1px solid currentColor;transition:width .35s,border-color .3s}
.bill a.on,.bill a:hover{color:var(--light)}.bill a.on::after{width:54px;border-color:var(--spot)}
.dock{position:absolute;left:var(--gut);right:var(--gutr);bottom:26px;z-index:2;display:flex;align-items:center;gap:18px}
.segs{flex:1;display:flex;gap:6px}
.segs button{flex:1;height:22px;background:none;border:0;padding:0;cursor:pointer;position:relative}
.segs button::before,.segs button i{content:"";position:absolute;left:0;top:10px;height:2px;width:100%;background:var(--rail)}
.segs button i{background:var(--spot);width:0}
.segs button.done i{width:100%}.segs button.on i{animation:fill var(--dur,6.5s) linear forwards}
.stg.paused .segs button.on i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--rail);background:none;color:var(--light);font:300 18px/1 var(--ui);cursor:pointer;transition:border-color .2s}
.arr:hover{border-color:var(--spot)}

/* афиша */
.sec{padding-block:clamp(48px,7vw,120px)}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:clamp(26px,4vw,64px);border-top:1px solid var(--rail);padding-top:16px}
.sech h2{margin:0;font:italic 400 clamp(40px,5.6vw,88px)/1 var(--serif)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,90px) clamp(22px,5vw,96px);align-items:start}
.card{display:block;text-decoration:none}
.card:nth-child(even){margin-top:clamp(40px,10vw,170px)}
.card:nth-child(3n){padding-inline:0 12%}.card:nth-child(4n){padding-inline:10% 0}
.card .im{overflow:hidden;background:var(--wing)}
.card img{width:100%;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .5s;filter:brightness(.86)}
.card:hover img{transform:scale(1.045);filter:none}
.card .m{display:flex;justify-content:space-between;gap:16px;margin-top:14px}
.card h3{margin:8px 0 6px;font:italic 400 clamp(32px,3.4vw,54px)/1 var(--serif)}
.card p{margin:0;color:#c9c4b9;max-width:30em;font-size:16px}

/* за кулисами */
.back{position:relative}
.back .ph{position:relative;max-height:78vh;overflow:hidden}
.back .ph img{width:100%;filter:grayscale(1) contrast(1.05)}
.back .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--stage) 2%,rgba(11,11,13,0) 46%),linear-gradient(90deg,rgba(11,11,13,.7),rgba(11,11,13,0) 46%)}
.back .hi{position:absolute;left:var(--gut);bottom:clamp(18px,5vw,70px);margin:0;font:italic 400 clamp(34px,5.4vw,86px)/1 var(--serif);max-width:9em;z-index:1}
.back .cols{display:grid;grid-template-columns:7fr 4fr;gap:clamp(22px,6vw,110px);margin-top:clamp(22px,3vw,44px)}
.back .cols p{margin:0 0 1em}
.back .cols p:first-child{font:400 clamp(24px,2.5vw,38px)/1.22 var(--serif);color:var(--light)}
.back .cols p{color:#cfcabf}
.edu{list-style:none;margin:0;padding:0}
.edu li{border-top:1px solid var(--rail);padding:14px 0 18px}
.edu b{display:block;font:400 clamp(22px,2vw,28px)/1.1 var(--serif);margin:6px 0 4px}
.edu span{color:var(--dim);font-size:15px}

/* отзывы */
.rvh{display:flex;gap:10px}
.rv{display:flex;gap:clamp(16px,2.4vw,36px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:18px;scrollbar-width:thin;scrollbar-color:var(--rail) transparent;margin-right:calc(var(--gutr)*-1);padding-right:var(--gutr)}
.rv figure{flex:0 0 min(78vw,460px);margin:0;scroll-snap-align:start;border-top:1px solid var(--rail);padding-top:16px;display:flex;flex-direction:column;gap:18px}
.rv blockquote{margin:0;font:400 clamp(21px,1.9vw,27px)/1.3 var(--serif);quotes:"«" "»"}
.rv blockquote::before{content:open-quote}.rv blockquote::after{content:close-quote}
.rv figcaption{margin-top:auto;display:flex;justify-content:space-between;gap:12px}
.rv .st{color:var(--spot);letter-spacing:.2em;font-size:12px;white-space:nowrap}

/* бриф */
.doors{border-top:1px solid var(--rail)}
.doors a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;border-bottom:1px solid var(--rail);padding-block:clamp(20px,3.2vw,46px);text-decoration:none;transition:padding .35s,color .3s}
.doors a:hover{padding-left:clamp(10px,2vw,30px);color:var(--spot)}
.doors b{display:block;font:italic 400 clamp(38px,6.4vw,104px)/1 var(--serif)}
.doors i{font:300 clamp(30px,4vw,60px)/1 var(--ui);font-style:normal}
.ft{display:flex;flex-wrap:wrap;gap:8px 36px;align-items:baseline;padding-block:26px 34px;color:var(--dim);font-size:15px}
.ft a{color:var(--light)}.ft .r{margin-left:auto}

/* кейс */
.khero{position:relative;height:clamp(520px,86vh,900px);overflow:hidden}
.khero img{width:100%;height:100%;object-fit:cover}
.khero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--stage) 0,rgba(11,11,13,.86) 30%,rgba(11,11,13,.3) 58%,rgba(11,11,13,.12) 74%,rgba(11,11,13,.55) 100%)}
.khero .in{position:absolute;left:0;right:0;bottom:clamp(20px,4vw,50px);z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(18px,4vw,70px);align-items:end}
.khero .bk{position:absolute;left:var(--gut);top:84px;z-index:1;text-decoration:none}
.khero h1{margin:12px 0 0;font:italic 400 clamp(52px,9vw,150px)/.9 var(--serif);text-wrap:balance}
.khero h1.long{font-size:clamp(42px,6.4vw,108px)}
.khero .ttl{margin:14px 0 0;font-size:clamp(17px,1.5vw,22px);max-width:30em;color:#d9d4c9}
.kmeta{margin:0;display:grid;gap:10px;min-width:230px}
.kmeta div{border-top:1px solid var(--rail);padding-top:8px}
.kmeta dd{margin:4px 0 0;font-size:15.5px;line-height:1.35}
.lead{padding-block:clamp(36px,6vw,100px) clamp(20px,3vw,50px)}
.lead p{margin:0;font:400 clamp(26px,3.3vw,52px)/1.16 var(--serif);max-width:24em;text-wrap:pretty}
.lead p::first-line{color:var(--light)}
.chap{display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);gap:clamp(22px,5vw,90px);align-items:start;border-top:1px solid var(--rail);padding-block:clamp(28px,4vw,64px)}
.chap.nomx{grid-template-columns:minmax(0,34fr) minmax(0,66fr)}
.chap .tx{position:sticky;top:88px}
.chap.nomx .tx{position:static;grid-column:2;max-width:40em}
.chap .k{display:flex;align-items:center;gap:12px;margin-bottom:14px}.chap .k i{width:32px;border-top:1px solid var(--spot)}
.chap h2{margin:0 0 18px;font:italic 400 clamp(32px,3.5vw,56px)/1 var(--serif);text-wrap:balance}
.chap h3{margin:22px 0 8px;font:400 12px/1.3 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.chap p{margin:0 0 14px;color:#d5d0c5}
.chap .say{font:italic 400 clamp(23px,2.1vw,31px)/1.22 var(--serif);color:var(--spot);margin:6px 0 16px}
.chap ul{list-style:none;margin:0 0 14px;padding:0}
.chap li{border-top:1px solid var(--rail);padding:10px 0 12px;color:#d5d0c5;font-size:16px}
.chap li b{display:block;font:500 16px/1.3 var(--ui);color:var(--light);margin-bottom:2px}
.mx{display:grid;gap:clamp(14px,2vw,30px);min-width:0}
figure{margin:0}
figure img{width:100%}
figcaption{margin-top:10px;color:var(--dim);font-size:14px;line-height:1.4}
figcaption b{display:block;font:400 22px/1.15 var(--serif);color:var(--light);margin-bottom:3px}
.gr{display:grid;gap:clamp(8px,1.2vw,16px);grid-template-columns:1fr 1fr}
.gr.n3{grid-template-columns:repeat(3,1fr)}
.gr img{height:100%;object-fit:cover}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,30px)}
.fg figure:first-child:nth-last-child(odd){grid-column:1/-1}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.2vw,16px)}
.ba div{position:relative}.ba span{position:absolute;left:10px;top:10px;font:400 10.5px/1 var(--ui);letter-spacing:.16em;background:rgba(11,11,13,.82);color:var(--light);padding:6px 8px}
.ba div:last-child span{background:var(--spot);color:#0B0B0D}
.mrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.4vw,40px);margin-top:clamp(10px,2vw,30px)}
.mrow div{border-top:1px solid var(--rail);padding-top:12px;min-width:0}
.mrow strong{display:block;font:italic 400 clamp(46px,5.4vw,92px)/.95 var(--serif);color:var(--spot);white-space:nowrap}
.mrow b{display:block;font:500 16px/1.3 var(--ui);margin:10px 0 6px}
.mrow p{margin:0;color:var(--dim);font-size:14.5px;line-height:1.45}
.nxt{position:relative;display:block;height:clamp(320px,62vh,640px);overflow:hidden;text-decoration:none;margin-top:clamp(30px,5vw,80px)}
.nxt img{width:100%;height:100%;object-fit:cover;filter:brightness(.6);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .6s}
.nxt:hover img{transform:scale(1.04);filter:brightness(.8)}
.nxt .in{position:absolute;left:0;right:0;bottom:clamp(20px,4vw,50px)}
.nxt b{display:block;font:italic 400 clamp(44px,7.4vw,124px)/.95 var(--serif);margin-top:10px}

@media (max-width:900px){
  body{font-size:16px}
  .hd nav{gap:18px}.hd nav a{font-size:11.5px;letter-spacing:.12em}.hd .id em{display:none}
  .bill{display:none}
  .stg{height:clamp(520px,calc(100vh - 70px),760px)}
  .stg::after{background:linear-gradient(0deg,var(--stage) 0,rgba(11,11,13,.82) 34%,rgba(11,11,13,.1) 70%,rgba(11,11,13,.5) 100%)}
  .stg .tx{max-width:none;right:var(--gutr);bottom:92px}
  .cards{grid-template-columns:1fr}.card:nth-child(n){margin-top:0;padding-inline:0}
  .back .cols{grid-template-columns:1fr}
  .back .ph img{min-height:340px;object-fit:cover;object-position:58% 40%}
  .khero .in{grid-template-columns:1fr}.kmeta{grid-template-columns:1fr 1fr;gap:10px 16px}
  .chap,.chap.nomx{grid-template-columns:minmax(0,1fr)}.chap .tx{position:static}.chap.nomx .tx{grid-column:1}
  .mrow{grid-template-columns:1fr 1fr}
  .ft .r{margin-left:0}
}
@media (max-width:520px){
  .hd{gap:12px}.hd .id{font-size:12.5px;letter-spacing:.16em}.hd nav{gap:12px}.hd nav a{font-size:10.5px;letter-spacing:.08em}
  .fg,.gr.n3{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}
  .arr{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.segs button.on i{width:100%}}
</style>
</head>
<body>
<div class="pbar wrap" id="pbar"></div>
<header class="hd wrap" id="hd">
  <a class="id" href="#home">Матвей Воронов<em>графический дизайнер</em></a>
  <nav aria-label="Основная"><a href="#bill" data-sec>Афиша</a><a href="#backstage" data-sec>О себе</a><a href="#reviews" data-sec>Отзывы</a><a href="#brief" data-sec>Бриф</a></nav>
</header>
<main id="app"></main>
<script src="assets/data.js"></script>
<script>
const P = MV.projects, me = MV.person;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const im = (f, alt, eager) => { const d = MV.dims[f] || [16, 9]; return `<img src="assets/${f}" alt="${esc(alt || '')}" width="${d[0]}" height="${d[1]}" ${eager ? '' : 'loading="lazy"'}>`; };
const nn = i => String(i + 1).padStart(2, '0');
const SPOT = { ri: '#F2C84B', salt: '#FFC20E', fas: '#F0483A', tme: '#D4A84B', sk: '#F0622D', kp: '#33B9C4' };
const STAGE = { ri: 'ri-05.jpg', salt: 'salt-11.jpg', fas: 'fas-01.jpg', tme: 'tme-02.jpg', sk: 'sk-05.jpg', kp: 'kp-cover.jpg' };
const CARD = { ri: 'ri-cover.jpg', salt: 'salt-13.jpg', fas: 'fas-cover.jpg', tme: 'tme-cover.jpg', sk: 'sk-cover.jpg', kp: 'kp-cover.jpg' };
const long = n => n.length > 14 ? 'long' : '';
const spot = id => document.documentElement.style.setProperty('--spot', SPOT[id] || '#FFC20E');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

function home() {
  return `
<section class="stg" id="stg" aria-roledescription="карусель" aria-label="Проекты">
  ${P.map((p, i) => `<div class="sl" data-i="${i}">${im(STAGE[p.id], p.name, i < 2)}</div>`).join('')}
  <div class="tx" id="stx" aria-live="polite"></div>
  <ol class="bill">${P.map((p, i) => `<li><a href="#${p.id}" data-i="${i}">${esc(p.name)} <span>${nn(i)}</span></a></li>`).join('')}</ol>
  <div class="dock"><button class="arr" id="prev" aria-label="Предыдущий проект">←</button><div class="segs">${P.map((p, i) => `<button data-i="${i}" aria-label="${esc(p.name)}"><i></i></button>`).join('')}</div><button class="arr" id="next" aria-label="Следующий проект">→</button></div>
</section>
<section class="sec wrap" id="bill">
  <div class="sech"><h2>Афиша</h2><span class="cap">Шесть проектов · 2023—2025</span></div>
  <div class="cards">${P.map((p, i) => `<a class="card" href="#${p.id}">
    <div class="im">${im(CARD[p.id], p.name)}</div>
    <div class="m cap"><span>${nn(i)} · ${esc(p.kind)}</span><span>${p.year}</span></div>
    <h3>${esc(p.name)}</h3><p>${esc(p.title)}</p></a>`).join('')}</div>
</section>
<section class="back" id="backstage">
  <div class="ph">${im(me.photo, me.name)}<p class="hi">${esc(me.hello)}</p></div>
  <div class="wrap"><div class="cols">
    <div><p>${esc(me.about[0])}</p><p>${esc(me.about[1])}</p></div>
    <ul class="edu">${me.education.map(e => `<li><span class="cap">${e[0]}</span><b>${esc(e[1])}</b><span>${esc(e[2])}</span></li>`).join('')}</ul>
  </div></div>
</section>
<section class="sec wrap" id="reviews">
  <div class="sech"><h2>Отзывы</h2><div class="rvh"><button class="arr" id="rp" aria-label="Назад">←</button><button class="arr" id="rn" aria-label="Вперёд">→</button></div></div>
  <div class="rv" id="rv" tabindex="0" aria-label="Девять отзывов заказчиков">${MV.reviews.map(r => `<figure><blockquote>${esc(r[1])}</blockquote><figcaption><span class="cap">${esc(r[0])}</span><span class="st" title="5 из 5 за точность ТЗ и за общение">★★★★★</span></figcaption></figure>`).join('')}</div>
</section>
<section class="sec wrap" id="brief" style="padding-top:0">
  <div class="sech"><h2>Вы заполняете бриф</h2><span class="cap">Как я работаю</span></div>
  <div class="doors">
    <a href="${me.briefs[0][1]}" target="_blank" rel="noopener"><span><span class="cap">Бриф для коммерческих проектов</span><b>Коммерческий проект</b></span><i>↗</i></a>
    <a href="${me.briefs[1][1]}" target="_blank" rel="noopener"><span><span class="cap">Бриф для гражданских активистов</span><b>Гражданская инициатива</b></span><i>↗</i></a>
  </div>
</section>`;
}

function kase(p) {
  const i = P.indexOf(p), nx = P[(i + 1) % P.length];
  const ch = [{ tx: [], mx: [], wide: [] }];
  for (const b of p.blocks) {
    const [t, a, c] = b, cur = ch[ch.length - 1];
    if (t === 'h') ch.push({ num: a, title: c, tx: [], mx: [], wide: [] });
    else if (t === 'p') cur.tx.push(`<p>${esc(a)}</p>`);
    else if (t === 'h3') cur.tx.push(`<h3>${esc(a)}</h3>`);
    else if (t === 'lead') cur.tx.push(`<p class="say">${esc(a)}</p>`);
    else if (t === 'list') cur.tx.push(`<ul>${a.map(x => `<li>${x[0] ? `<b>${esc(x[0])}</b>` : ''}${esc(x[1])}</li>`).join('')}</ul>`);
    else if (t === 'img') cur.mx.push(`<figure>${im(a, c)}<figcaption>${esc(c)}</figcaption></figure>`);
    else if (t === 'imgs') cur.mx.push(`<figure><div class="gr n${a.length}">${a.map(f => im(f, c)).join('')}</div><figcaption>${esc(c)}</figcaption></figure>`);
    else if (t === 'figs') cur.mx.push(`<div class="fg">${a.map(f => `<figure>${im(f[0], f[1])}<figcaption><b>${esc(f[1])}</b>${esc(f[2])}</figcaption></figure>`).join('')}</div>`);
    else if (t === 'ba') cur.mx.push(a.map(x => `<figure><div class="ba"><div><span>ДО</span>${im(x[0], 'До')}</div><div><span>ПОСЛЕ</span>${im(x[1], 'После')}</div></div><figcaption>${esc(x[2])}</figcaption></figure>`).join(''));
    else if (t === 'metrics') cur.wide.push(`<div class="mrow">${a.map(m => `<div><strong>${esc(m[0])}</strong><b>${esc(m[1])}</b><p>${esc(m[2])}</p></div>`).join('')}</div>`);
  }
  return `
<article>
  <header class="khero">${im(STAGE[p.id], p.name, true)}
    <a class="bk cap" href="#bill" data-sec>← Афиша</a>
    <div class="in wrap">
      <div><span class="cap">${nn(i)} / 06 · ${esc(p.kind)}</span><h1 class="${long(p.name)}">${esc(p.name)}</h1><p class="ttl">${esc(p.title)}</p></div>
      <dl class="kmeta">
        <div><dt class="cap">Объём работ</dt><dd>${p.scope.map(esc).join('<br>')}</dd></div>
        <div><dt class="cap">Формат · год</dt><dd>${esc(p.category)} · ${p.year}</dd></div>
        <div><dt class="cap">Роль</dt><dd>${esc(p.role)}</dd></div>
      </dl>
    </div>
  </header>
  <div class="wrap">
    <div class="lead"><p>${esc(p.lead)}</p></div>
    ${ch.filter(c => c.tx.length || c.mx.length || c.wide.length).map(c => `<section class="chap ${c.mx.length ? '' : 'nomx'}">
      <div class="tx">${c.num ? `<div class="k cap"><i></i>Глава ${c.num}</div>` : ''}${c.title ? `<h2>${esc(c.title)}</h2>` : ''}${c.tx.join('')}</div>
      ${c.mx.length ? `<div class="mx">${c.mx.join('')}</div>` : ''}${c.wide.join('')}
    </section>`).join('')}
  </div>
  <a class="nxt" href="#${nx.id}">${im(STAGE[nx.id], nx.name)}<div class="in wrap"><span class="cap">Следующий проект · ${nn(P.indexOf(nx))} / 06</span><b>${esc(nx.name)}</b></div></a>
</article>`;
}

const foot = () => `<footer class="ft wrap"><span>${me.name}, графический дизайнер</span><a href="${me.telegram[1]}" target="_blank" rel="noopener">Telegram ${me.telegram[0]}</a><span style="user-select:all;color:var(--light)">${me.email}</span><span class="r">Если вам близок такой подход к дизайну и коммуникации — давайте обсудим ваш проект.</span></footer>`;

let cur = 0, timer = null;
function show(i, user) {
  const stg = document.getElementById('stg'); if (!stg) return;
  cur = (i + P.length) % P.length; const p = P[cur]; spot(p.id);
  stg.querySelectorAll('.sl').forEach((s, k) => s.classList.toggle('on', k === cur));
  stg.querySelectorAll('.bill a').forEach((a, k) => a.classList.toggle('on', k === cur));
  stg.querySelectorAll('.segs button').forEach((b, k) => { b.classList.remove('on', 'done'); if (k < cur) b.classList.add('done'); });
  const sb = stg.querySelectorAll('.segs button')[cur]; void sb.offsetWidth; sb.classList.add('on');
  const tx = document.getElementById('stx');
  tx.classList.remove('sw'); if (user !== 0) { void tx.offsetWidth; tx.classList.add('sw'); }
  tx.innerHTML = `<div class="no cap"><span>${nn(cur)} / 06</span><i></i><span>${esc(p.kind)}</span></div><h1 class="${long(p.name)}">${esc(p.name)}</h1><p>${esc(p.title)}</p><a class="go" href="#${p.id}">Смотреть проект <b>→</b></a>`;
  clearTimeout(timer);
  if (!reduce) timer = setTimeout(() => { if (!stg.classList.contains('paused')) show(cur + 1); }, 6500);
}
function bindHome() {
  const stg = document.getElementById('stg'); if (!stg) return;
  document.getElementById('prev').onclick = () => show(cur - 1, 1);
  document.getElementById('next').onclick = () => show(cur + 1, 1);
  stg.querySelectorAll('.segs button').forEach(b => b.onclick = () => show(+b.dataset.i, 1));
  stg.querySelectorAll('.bill a').forEach(a => a.onmouseenter = a.onfocus = () => { if (+a.dataset.i !== cur) show(+a.dataset.i, 1); });
  const pause = v => { stg.classList.toggle('paused', v); if (!v) show(cur); };
  stg.onmouseenter = () => stg.classList.add('paused'); stg.onmouseleave = () => pause(false);
  let x0 = null;
  stg.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  stg.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 44) show(cur + (dx < 0 ? 1 : -1), 1); x0 = null; }, { passive: true });
  const rv = document.getElementById('rv'), step = () => rv.querySelector('figure').getBoundingClientRect().width + 24;
  document.getElementById('rp').onclick = () => rv.scrollBy({ left: -step(), behavior: reduce ? 'auto' : 'smooth' });
  document.getElementById('rn').onclick = () => rv.scrollBy({ left: step(), behavior: reduce ? 'auto' : 'smooth' });
  show(cur, 0);
}
addEventListener('keydown', e => { if (!document.getElementById('stg') || scrollY > innerHeight * .6 || e.target.closest('#rv')) return; if (e.key === 'ArrowRight') show(cur + 1, 1); if (e.key === 'ArrowLeft') show(cur - 1, 1); });

const SECS = ['bill', 'backstage', 'reviews', 'brief'], app = document.getElementById('app');
function route() {
  const h = location.hash.slice(1), p = P.find(x => x.id === h), isSec = SECS.includes(h);
  clearTimeout(timer);
  if (p) { app.innerHTML = kase(p) + foot(); app.dataset.v = p.id; spot(p.id); scrollTo(0, 0); }
  else {
    if (app.dataset.v !== 'home') { app.innerHTML = home() + foot(); app.dataset.v = 'home'; bindHome(); } else show(cur);
    if (isSec) requestAnimationFrame(() => document.getElementById(h)?.scrollIntoView()); else scrollTo(0, 0);
  }
  document.getElementById('pbar').innerHTML = `<span>Прототип · концепция 3 из 3</span><a href="concept-1.html#${p ? h : ''}">1 Плакат</a><a href="concept-2.html#${p ? h : ''}">2 Регламент</a><a href="concept-3.html#${p ? h : ''}" aria-current="page">3 Сцена</a><a class="sp" href="index.html">← Обзор и сравнение</a>`;
  document.title = (p ? p.name + ' — ' : '') + 'Сцена — концепция 3';
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-sec]'); if (!a) return;
  const id = a.getAttribute('href').slice(1);
  if (location.hash.slice(1) === id) { e.preventDefault(); document.getElementById(id)?.scrollIntoView(); }
});
const hd = document.getElementById('hd');
addEventListener('scroll', () => hd.classList.toggle('solid', scrollY > innerHeight * .5), { passive: true });
addEventListener('hashchange', route); route();
</script>
</body>
</html>
