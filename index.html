<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Воронов — портфолио</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600;800;900&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Плакат: сайт как серия плакатов. Хром сайта ахроматичен, цвет приносят сами проекты.
   Вертикальная лента полноцветных полос, гигантский узкий гротеск, фигуры-примитивы как навигация. */
:root{
  --paper:#EFEFEA; --ink:#0C0C0D; --mute:#6E6E69; --rule:var(--ink);
  --pb:var(--paper); --pf:var(--ink); --pa:var(--ink); --hb:var(--paper); --hf:var(--ink);
  --display:'Sofia Sans Extra Condensed','Oswald','Arial Narrow','Roboto Condensed',sans-serif;
  --text:'Golos Text','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --gut:max(clamp(16px,3.2vw,52px),env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--text);overflow-x:hidden;transition:background-color .35s,color .35s}
:root.dark{--mute:color-mix(in srgb,var(--ink) 64%,var(--paper));color-scheme:dark}
.dark .s-salt i{background:#F1F5FF}.dark .s-tme i{box-shadow:0 0 0 1.5px #D4A84B}.dark .s-kp i::after{border-color:#EFEFEA}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.wrap{padding-left:var(--gut);padding-right:max(clamp(16px,3.2vw,52px),env(safe-area-inset-right,0px))}
.mono{font:500 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* служебная полоса прототипа — не часть дизайна */

/* шапка */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--rule)}
.hd .in{display:flex;align-items:center;gap:24px;padding-block:12px}
.hd .id{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-decoration:none}
.hd .rl{color:var(--mute)}
.hd nav{margin-left:auto;display:flex;gap:26px}
.hd nav a{text-decoration:none;font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 0;border-bottom:2px solid transparent}
.hd nav a:hover{border-color:currentColor}
.tbtn{background:none;border:2px solid var(--ink);color:var(--ink);font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 11px;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.tbtn:hover,.tbtn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.hd .mbtn{display:none;margin-left:auto;background:var(--ink);color:var(--paper);border:0;font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:30;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;padding-block:calc(18px + env(safe-area-inset-top,0px)) 28px}
.ov button{align-self:flex-end;background:none;border:2px solid currentColor;color:inherit;font:500 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;cursor:pointer}
.ov a{font:900 19vw/.86 var(--display);text-transform:uppercase;text-decoration:none;display:block;margin-top:.12em}
.ov .sub{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.ov .sub a{font:500 14px/1.4 var(--mono);text-transform:none}

/* первый экран */
.hero{padding-block:clamp(20px,3vw,44px) 0}
.hero-pre{font:500 clamp(18px,2.1vw,30px)/1.2 var(--text);margin:0 0 .2em}
.hero h1{margin:0;font:900 100px/.8 var(--display);text-transform:uppercase;letter-spacing:-.005em}
.fitline{display:block;white-space:nowrap;overflow:hidden;line-height:.8;padding-block:.04em}
.fitline>span{display:inline-block}
.row2{display:grid;grid-template-columns:62fr 38fr;gap:clamp(16px,3vw,48px);align-items:end}
.hero-post{font:500 clamp(18px,2.1vw,30px)/1.2 var(--text);text-transform:none;letter-spacing:0;padding-bottom:.5em;max-width:16em}
.hero-meta{display:grid;grid-template-columns:4fr 5fr 3fr;gap:clamp(16px,3vw,48px);border-top:2px solid var(--rule);margin-top:clamp(18px,2.4vw,36px);padding-block:14px clamp(20px,3vw,40px)}
.hero-meta p{margin:0;max-width:34em}
.hero-meta b{font-weight:600}
.cta{display:inline-flex;align-items:center;gap:12px;font:800 clamp(24px,2.4vw,34px)/1 var(--display);text-transform:uppercase;text-decoration:none;justify-self:end;align-self:start}
.cta i{width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-style:normal;font-family:var(--text);font-size:.7em;transition:transform .25s}
.cta:hover i{transform:translateY(4px)}

/* супрематическая композиция: фигура = проект */
.supre{position:relative;aspect-ratio:16/7.2;border-top:2px solid var(--rule);overflow:hidden}
.supre .cap{position:absolute;left:var(--gut);bottom:18px;max-width:min(30em,60%);z-index:3;pointer-events:none}
.supre .cap b{display:block;font:800 clamp(26px,3.4vw,52px)/.9 var(--display);text-transform:uppercase;margin-top:6px}
.supre .cap span{display:block;margin-top:6px;font-size:15px;line-height:1.35;max-width:26em}
.sh{position:absolute;display:block;text-decoration:none;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .25s}
.sh i{position:absolute;inset:0;display:block}
.sh .lb em{font-style:normal}
.sh .lb{z-index:2;position:absolute;left:0;top:calc(100% + 8px);white-space:nowrap;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.supre:hover .sh:not(:hover),.supre:focus-within .sh:not(:focus-visible){opacity:.22}
.supre:focus-within .sh:hover{opacity:1}
.sh:hover,.sh:focus-visible{transform:scale(1.06);z-index:2}
.s-ri{left:7%;top:10%;width:27%;aspect-ratio:1}.s-ri i{border-radius:50%;background:#F2C84B}
.s-ri i::after{content:"";position:absolute;right:-6%;bottom:8%;width:34%;aspect-ratio:1;border-radius:50%;background:#4A6FE3}
.s-salt{left:26%;top:50%;width:50%;height:8.5%}.s-salt i{background:#121212;transform:rotate(-21deg)}
.s-salt i::after{content:"";position:absolute;left:14%;top:150%;width:52%;height:26%;background:#FFC20E}
.s-salt .lb{left:60%;top:230%}
.s-fas{left:60%;top:7%;width:15%;aspect-ratio:1}
.s-fas i{background:#0B6B2B;clip-path:polygon(50% 0,64.65% 14.64%,85.36% 14.64%,85.36% 35.35%,100% 50%,85.36% 64.65%,85.36% 85.36%,64.65% 85.36%,50% 100%,35.35% 85.36%,14.64% 85.36%,14.64% 64.65%,0 50%,14.64% 35.35%,14.64% 14.64%,35.35% 14.64%)}
.s-fas i::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#E32A1C}
.s-fas .lb{top:auto;bottom:calc(100% + 8px)}
.s-tme{left:41%;top:9%;width:11.5%;aspect-ratio:1}.s-tme i{background:#17132B;transform:rotate(11deg)}
.s-tme .lb{top:auto;bottom:calc(100% + 14px)}
.s-tme i::after{content:"";position:absolute;inset:16% 16% 30% 16%;border:2px solid #D4A84B;border-color:#D4A84B transparent transparent #D4A84B;border-radius:50%;transform:rotate(-20deg)}
.s-sk{left:71%;top:48%;width:21%;aspect-ratio:1.25}.s-sk i{background:#D9410B;clip-path:polygon(0 12%,100% 0,38% 100%)}
.s-sk .lb{top:auto;bottom:-4%;left:44%}
.s-kp{left:84%;top:9%;width:8.5%;aspect-ratio:1}.s-kp i{background:#33B9C4}
.s-kp i::after{content:"";position:absolute;left:28%;top:28%;width:100%;height:100%;border:2px solid #0E2A2E}

/* полосы-плакаты */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:2px solid var(--rule);padding-block:14px 10px}
.sect-h h2{margin:0;font:900 clamp(44px,7vw,112px)/.86 var(--display);text-transform:uppercase}
.poster{background:var(--pb);color:var(--pf);padding-block:clamp(22px,3.2vw,46px) clamp(30px,4.6vw,70px);display:block;text-decoration:none;position:relative}
.poster .top{display:flex;gap:10px 28px;flex-wrap:wrap;justify-content:space-between;border-top:2px solid currentColor;padding-top:10px}
.poster h3{margin:.08em 0 .16em;font:900 12vw/.82 var(--display);text-transform:uppercase;letter-spacing:-.005em}
.t-xl h3,.t-xl.chd h1{font-size:min(34vw,560px)}.t-l h3,.t-l.chd h1{font-size:min(17.5vw,300px)}.t-m h3,.t-m.chd h1{font-size:min(13vw,230px)}.t-s h3,.t-s.chd h1{font-size:min(10.6vw,190px)}
.poster .row{display:grid;grid-template-columns:5fr 7fr;gap:clamp(18px,4vw,64px);align-items:end}
.poster.flip .row{grid-template-columns:7fr 5fr}.poster.flip .pic{order:-1}
.poster .txt p{margin:0 0 18px;font:500 clamp(19px,1.9vw,27px)/1.25 var(--text);max-width:22em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.tags li{border:1.5px solid currentColor;padding:5px 9px;font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.go{display:inline-flex;align-items:center;gap:12px;font:800 clamp(24px,2.3vw,34px)/1 var(--display);text-transform:uppercase}
.go i{width:1.6em;height:1.6em;border-radius:50%;background:var(--pa);color:var(--pb);display:grid;place-items:center;font:600 .62em/1 var(--text);transition:transform .25s}
.poster:hover .go i,.next:hover .go i{transform:translateX(6px)}
.pic{overflow:hidden;aspect-ratio:16/10;background:rgba(0,0,0,.12)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.poster:hover .pic img{transform:scale(1.04)}
.c-circle{aspect-ratio:1;border-radius:50%;max-width:min(100%,520px);margin-left:auto}
.c-para{clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}
.c-oct{aspect-ratio:1;clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);max-width:min(100%,520px)}
.c-cut{clip-path:polygon(0 0,100% 0,100% 72%,80% 100%,0 100%)}
.c-tilt{transform:rotate(-2.2deg)}

/* о себе */
.about{background:var(--ink);color:var(--paper);padding-block:clamp(30px,5vw,80px)}
.about .x{position:relative;margin:0 0 clamp(26px,4vw,60px);font:900 clamp(54px,12.5vw,230px)/.82 var(--display);text-transform:uppercase}
.about .x span{display:block}.about .x span+span{margin-top:.07em}
.about .x .thin{font-weight:600;letter-spacing:.02em;color:transparent;-webkit-text-stroke:1.5px var(--paper)}
.about .cols{display:grid;grid-template-columns:4fr 5fr 3fr;gap:clamp(18px,4vw,64px);align-items:start}
.about .ph{border-radius:50%;overflow:hidden;aspect-ratio:1;max-width:420px}
.about .ph img{width:100%;height:100%;object-fit:cover;object-position:58% 40%;filter:grayscale(1) contrast(1.08)}
.about p{margin:0 0 1em;font-size:clamp(17px,1.35vw,20px);max-width:34em}
.about p:first-child{font-weight:500;font-size:clamp(20px,1.9vw,28px);line-height:1.25}
.edu{margin:0;padding:0;list-style:none}
.edu li{border-top:1.5px solid currentColor;padding:10px 0 16px}
.edu b{display:block;font:800 24px/1 var(--display);text-transform:uppercase;margin:6px 0 4px}
.edu span{font-size:14px;opacity:.75}

/* отзывы */
.rev{padding-block:clamp(26px,4vw,64px)}
.rev .big{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,4vw,64px);align-items:end;margin-bottom:clamp(20px,3vw,44px)}
.rev .n{font:900 clamp(120px,24vw,400px)/.74 var(--display)}
.rev .big p{margin:0;font:500 clamp(20px,2.2vw,32px)/1.2 var(--text);max-width:18em;padding-bottom:.3em}
.rev ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0 clamp(18px,3vw,48px)}
.rev li{border-top:2px solid var(--rule);padding:12px 0 26px;min-width:0}
.rev li q{display:block;quotes:"«" "»";margin-top:10px;font-size:16px;line-height:1.45}
.rev li:nth-child(-n+3) q{font:500 clamp(18px,1.5vw,22px)/1.32 var(--text)}

/* бриф */
.brief{display:grid;grid-template-columns:1fr 1fr}
.brief a{display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:clamp(260px,34vw,480px);padding-block:clamp(20px,3vw,40px);text-decoration:none}
.brief a:first-child{background:#F2C84B;color:#0C0C0D}
.brief a:last-child{background:#D9410B;color:#fff}
.brief b{font:900 clamp(48px,7.4vw,128px)/.84 var(--display);text-transform:uppercase;display:block}
.brief .go i{background:currentColor}.brief a:first-child .go i span{color:#F2C84B}.brief a:last-child .go i span{color:#D9410B}
.ft{background:var(--ink);color:var(--paper);padding-block:22px}
.ft .in{display:flex;flex-wrap:wrap;gap:10px 40px;align-items:baseline}
.ft b{font:800 24px/1 var(--display);text-transform:uppercase}
.ft a{font:500 14px/1.4 var(--mono)}
.ft .r{margin-left:auto;opacity:.6;font-size:13px}

/* кейс */
.chd{background:var(--hb);color:var(--hf);padding-block:16px clamp(22px,3vw,44px)}
.chd .top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid currentColor;padding-bottom:10px}
.chd .top a{text-decoration:none}
.chd h1{margin:.1em 0 .14em;font:900 12vw/.82 var(--display);text-transform:uppercase;letter-spacing:-.005em}
.chd .sub{font:500 clamp(20px,2.3vw,34px)/1.2 var(--text);margin:0 0 clamp(20px,3vw,40px);max-width:24em}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0 clamp(16px,3vw,48px);margin:0}
.meta div{border-top:2px solid currentColor;padding:10px 0 4px;min-width:0}
.meta dt{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.meta dd{margin:8px 0 0;font:800 clamp(20px,1.8vw,27px)/1.02 var(--display);text-transform:uppercase}
.cover{background:var(--hb)}.cover img{width:100%;height:auto}
.body{padding-block:clamp(24px,4vw,64px) 0}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 clamp(14px,2vw,28px)}
.g>*{grid-column:5/13;margin:0 0 clamp(18px,2vw,28px)}
.g>.full{grid-column:1/-1}
.g>.lead0{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 clamp(14px,2vw,28px);margin-bottom:clamp(30px,5vw,80px)}
.lead0 .mono{grid-column:1/5;padding-top:.6em}
.lead0 p{grid-column:5/13;margin:0;font:500 clamp(22px,2.6vw,40px)/1.2 var(--text)}
.g p{font-size:clamp(17px,1.3vw,20px);max-width:36em}
.sec{grid-column:1/-1!important;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 clamp(14px,2vw,28px);align-items:end;border-top:6px solid var(--ink);padding-top:14px;margin-top:clamp(30px,5vw,80px)!important}
.sec .num{grid-column:1/5;font:900 clamp(84px,13vw,220px)/.76 var(--display)}
.sec .num em{font-style:normal;display:inline-block;background:var(--pb);color:var(--pf);padding:.06em .1em 0}
.sec h2{grid-column:5/13;margin:0;font:900 clamp(40px,5.6vw,92px)/.88 var(--display);text-transform:uppercase}
.sec.nonum h2{grid-column:1/-1}
.g h3{font:800 clamp(26px,2.6vw,40px)/1 var(--display);text-transform:uppercase;margin-top:clamp(12px,2vw,28px)}
.stmt{grid-column:1/-1!important;background:var(--pb);color:var(--pf);margin-inline:calc(var(--gut)*-1)!important;padding:clamp(26px,5vw,80px) var(--gut)}
.stmt p{margin:0;font:800 clamp(34px,5.4vw,92px)/.94 var(--display);text-transform:uppercase;max-width:none}
.li{list-style:none;padding:0;counter-reset:n}
.li li{counter-increment:n;display:grid;grid-template-columns:3.2em 1fr;border-top:2px solid var(--ink);padding:12px 0 16px}
.li li::before{content:counter(n,decimal-leading-zero);font:500 12px/1.9 var(--mono)}
.li b{display:block;font:800 clamp(24px,2vw,30px)/1 var(--display);text-transform:uppercase;margin-bottom:6px}
figure{margin:0}
figcaption{font:500 11.5px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-top:8px;max-width:60em}
.fig img{width:100%}
.grid{display:grid;gap:clamp(10px,1.4vw,20px)}
.grow{display:flex;gap:clamp(10px,1.4vw,20px)}.grow>div{min-width:0}.grow img{width:100%;height:auto}
.figs{display:grid;gap:clamp(14px,2vw,28px);grid-template-columns:repeat(3,1fr);align-items:start}
.figs.n2{grid-template-columns:1fr 1fr}
.figs b{display:block;font:800 clamp(24px,2vw,30px)/1 var(--display);text-transform:uppercase;margin:12px 0 6px}
.figs p{font-size:15.5px;margin:0}
.figs img{width:100%;height:auto}
.mt{grid-column:1/-1!important;background:var(--pb);color:var(--pf);margin-inline:calc(var(--gut)*-1)!important;padding:clamp(20px,3vw,44px) var(--gut);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 clamp(14px,2vw,28px)}
.mt div{border-top:2px solid currentColor;padding-top:8px;min-width:0}
.mt strong{display:block;font:900 clamp(52px,6.2vw,112px)/.84 var(--display);white-space:nowrap}
.mt b{display:block;font:800 clamp(21px,1.7vw,26px)/1 var(--display);text-transform:uppercase;margin:12px 0 8px}
.mt p{font-size:14.5px;line-height:1.4;margin:0;opacity:.9}
.ba{display:grid;gap:clamp(18px,2.4vw,34px)}
.ba .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,1.4vw,20px);align-items:center}
.ba .pair div{position:relative;border:2px solid var(--ink)}
.ba .pair div img{width:100%}
.ba .pair div span{position:absolute;left:-2px;top:-2px;background:var(--ink);color:var(--paper);padding:5px 8px;font:500 11px/1 var(--mono);letter-spacing:.06em}
.ba .pair div:last-child span{background:var(--pb);color:var(--pf)}
.ba .ar{font:900 clamp(30px,4vw,60px)/1 var(--display)}
.ba p{margin:8px 0 0;font-size:15.5px}
.next{display:block;text-decoration:none;background:var(--pb);color:var(--pf);margin-top:clamp(40px,6vw,96px);padding-block:clamp(22px,3vw,44px)}
.next .top{display:flex;justify-content:space-between;border-top:2px solid currentColor;padding-top:10px}
.next h3{font:900 12vw/.82 var(--display);text-transform:uppercase;margin:.08em 0 .14em}

/* типографика: без висячих строк (в JS — неразрывные пробелы, здесь — запасной перенос) */
@media (max-width:860px){
  body{font-size:16px}
  .hd nav,.hd .rl{display:none}.hd .mbtn{display:block;margin-left:0}.hd .in{gap:10px}.tbtn{margin-left:auto;padding:10px 11px}.tbtn .x{display:none}
  .row2{grid-template-columns:1fr}.row2 .fitline{width:100%}.hero-post{max-width:none;padding:0;margin-top:10px}
  .hero-meta{grid-template-columns:1fr}.cta{justify-self:start}
  .supre{aspect-ratio:1/1.34}
  .supre .cap{bottom:auto;top:14px;right:var(--gut);max-width:none}
  .s-ri{left:6%;top:31%;width:46%}.s-salt{left:14%;top:70%;width:74%;height:4.4%}.s-fas{left:62%;top:30%;width:26%}
  .s-tme{left:40%;top:57%;width:17%}.s-sk{left:58%;top:77%;width:34%}.s-kp{left:78%;top:55%;width:13%}
  .sh .lb{font-size:11px}.sh .lb em{display:none}.s-salt .lb{top:420%;left:48%}
  .poster .row,.poster.flip .row{grid-template-columns:1fr}.poster.flip .pic{order:0}
  .t-xl h3,.t-xl.chd h1{font-size:44vw}.t-l h3,.t-l.chd h1{font-size:23vw}.t-m h3,.t-m.chd h1{font-size:19vw}.t-s h3,.t-s.chd h1{font-size:16vw}
  .c-circle,.c-oct{margin-inline:0;max-width:78%}
  .about .cols{grid-template-columns:1fr}.about .ph{max-width:62%}
  .rev .big{grid-template-columns:1fr}.rev ul{grid-template-columns:1fr}
  .brief{grid-template-columns:1fr}
  .meta{grid-template-columns:1fr 1fr}
  .g>*{grid-column:1/-1}.lead0 .mono,.lead0 p,.sec .num,.sec h2{grid-column:1/-1}.lead0 .mono{margin-bottom:10px}
  .sec .num{margin-bottom:10px}
  .figs,.figs.n2{grid-template-columns:1fr}.grow{flex-direction:column}.grow>div{flex:none!important}
  .mt{grid-template-columns:1fr 1fr;row-gap:22px}
  .ba .pair{grid-template-columns:1fr}.ba .ar{transform:rotate(90deg);justify-self:center;line-height:.6}
  .ft .r{margin-left:0}
}
@media (max-width:480px){.mt{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hd"><div class="in wrap">
  <a class="id" href="#home">Матвей Воронов</a><span class="mono rl">Графический дизайнер</span>
  <nav aria-label="Основная"><a href="#works" data-sec>Работы</a><a href="#about" data-sec>О себе</a><a href="#reviews" data-sec>Отзывы</a><a href="#brief" data-sec>Бриф</a></nav>
  <button class="tbtn" id="tbtn" aria-pressed="false"><span id="tlab">Тёмная</span><span class="x"> тема</span></button>
  <button class="mbtn" id="mbtn" aria-expanded="false" aria-controls="ov">Меню</button>
</div></header>
<div class="ov wrap" id="ov" hidden>
  <button id="mclose">Закрыть</button>
  <a href="#works" data-sec>Работы</a><a href="#about" data-sec>О себе</a><a href="#reviews" data-sec>Отзывы</a><a href="#brief" data-sec>Бриф</a>
  <div class="sub"><a href="https://t.me/Arelman">Telegram @Arelman</a><span class="mono" style="text-transform:none">korvinart23@gmail.com</span></div>
</div>
<main id="app"></main>
<script src="assets/data.js"></script>
<script>
const P = MV.projects, me = MV.person;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const im = (f, alt) => { const d = MV.dims[f] || [16, 9]; return `<img src="assets/${f}" alt="${esc(alt || '')}" width="${d[0]}" height="${d[1]}" loading="lazy">`; };
const pal = p => `--pb:${p.pal.bg};--pf:${p.pal.fg};--pa:${p.pal.ac};--hb:${p.pal.bg};--hf:${p.pal.fg}`;
/* тёмная тема: у каждого кейса свой фон; полосы-акценты берут второй цвет проекта */
const DK = {
  ri: { bg: '#14227A', fg: '#FFF8E7', band: '#F2C84B', bf: '#14227A', ac: '#F2C84B' },
  salt: { bg: '#111111', fg: '#F1F5FF', band: '#FFC20E', bf: '#111111', ac: '#FFC20E' },
  fas: { bg: '#0B6B2B', fg: '#FFFFFF', band: '#FFFFFF', bf: '#0B6B2B', ac: '#E32A1C' },
  tme: { bg: '#17132B', fg: '#F3EBDD', band: '#D4A84B', bf: '#17132B', ac: '#D4A84B' },
  sk: { bg: '#1E4A6E', fg: '#FFFFFF', band: '#D9410B', bf: '#FFFFFF', ac: '#D9A441' },
  kp: { bg: '#444444', fg: '#FFFFFF', band: '#33B9C4', bf: '#0E2A2E', ac: '#33B9C4' }
};
let dark = false; try { dark = localStorage.getItem('mv-theme') === 'dark'; } catch (e) {}
const apal = p => { const d = DK[p.id]; return dark ? `--pb:${d.band};--pf:${d.bf};--pa:${d.ac};--hb:${d.bg};--hf:${d.fg}` : pal(p); };
function theme(p) {
  const r = document.documentElement; r.classList.toggle('dark', dark);
  if (dark) { r.style.setProperty('--paper', p ? DK[p.id].bg : '#0C0C0D'); r.style.setProperty('--ink', p ? DK[p.id].fg : '#EFEFEA'); }
  else { r.style.removeProperty('--paper'); r.style.removeProperty('--ink'); }
  document.getElementById('tlab').textContent = dark ? 'Светлая' : 'Тёмная'; document.getElementById('tbtn').setAttribute('aria-pressed', String(dark));
  const a = document.querySelector('#app article'); if (a && p) a.style.cssText = apal(p);
}
const size = n => n.length <= 5 ? 't-xl' : n.length <= 12 ? 't-l' : n.length <= 18 ? 't-m' : 't-s';
const nm = n => esc(n).replace('Киберправда', 'Кибер<wbr>правда');
const nn = i => String(i + 1).padStart(2, '0');
const crops = { ri: 'c-circle', salt: 'c-para', fas: 'c-oct', tme: 'c-tilt', sk: 'c-cut', kp: '' };
const pics = { ri: 'ri-05.jpg', salt: 'salt-card.jpg', fas: 'fas-cover.jpg', tme: 'tme-02.jpg', sk: 'sk-05.jpg', kp: 'kp-01.jpg' };

function home() {
  return `
<section class="hero wrap">
  <p class="hero-pre">Дизайн — это мой способ</p>
  <h1 aria-label="Дизайн — это мой способ преобразовывать реальность, делая её доступной, понятной и эстетичной.">
    <span class="fitline"><span data-fit>преобразовывать</span></span>
    <span class="row2"><span class="fitline"><span data-fit>реальность,</span></span><span class="hero-post">делая её доступной, понятной и&nbsp;эстетичной.</span></span>
  </h1>
  <div class="hero-meta">
    <p><b>Матвей Воронов</b>, графический дизайнер. Сначала я выясняю, какую задачу должен решить проект, и только потом берусь за форму.</p>
    <p class="mono" style="line-height:1.7">Айдентика · Логотипы · Брендбуки · SMM-наборы и мерч · Бренд- и коммуникационная стратегия · Презентации</p>
    <a class="cta" href="#brief" data-sec>Заполнить бриф <i>↓</i></a>
  </div>
</section>
<section class="supre" aria-label="Шесть проектов — шесть фигур">
  ${P.map((p, i) => `<a class="sh s-${p.id}" href="#${p.id}" data-i="${i}" aria-label="${esc(p.name)}"><i></i><span class="lb">${nn(i)}<em> ${esc(p.name)}</em></span></a>`).join('')}
  <div class="cap" id="cap"><span class="mono">Шесть проектов — шесть фигур</span><b>Выберите любую</b><span>Каждая фигура собрана из цветов и знаков проекта и ведёт в его кейс.</span></div>
</section>
<section id="works">
  <div class="sect-h wrap"><h2>Работы</h2><span class="mono">06 проектов · 2023—2025</span></div>
  ${P.map((p, i) => `
  <a class="poster ${size(p.name)} ${i % 2 ? 'flip' : ''}" href="#${p.id}" style="${pal(p)}"><div class="wrap">
    <div class="top mono"><span>${nn(i)} / 06</span><span>${esc(p.kind)}</span><span>${esc(p.category)} · ${p.year}</span></div>
    <h3>${nm(p.name)}</h3>
    <div class="row">
      <div class="txt"><p>${esc(p.title)}</p><ul class="tags">${p.scope.map(s => `<li>${esc(s)}</li>`).join('')}</ul><span class="go">Смотреть кейс <i>→</i></span></div>
      <div class="pic ${crops[p.id]}">${im(pics[p.id], p.name)}</div>
    </div>
  </div></a>`).join('')}
</section>
<section class="about" id="about"><div class="wrap">
  <h2 class="x" aria-label="Европейский минимализм и русский авангард"><span class="thin">Европейский минимализм</span><span>× русский авангард</span></h2>
  <div class="cols">
    <div class="ph">${im(me.photo, 'Матвей Воронов')}</div>
    <div><p>${esc(me.about[1])}</p><p>${esc(me.about[0])}</p></div>
    <ul class="edu">${me.education.map(e => `<li><span class="mono">${e[0]}</span><b>${esc(e[1])}</b><span>${esc(e[2])}</span></li>`).join('')}</ul>
  </div>
</div></section>
<section class="rev wrap" id="reviews">
  <div class="sect-h" style="margin-bottom:clamp(20px,3vw,40px)"><h2>Отзывы</h2><span class="mono">Оценки заказчиков</span></div>
  <div class="big"><div class="n">9/9</div><p>Девять отзывов, и в каждом пять звёзд: за точность в выполнении ТЗ и за приятную работу.</p></div>
  <ul>${MV.reviews.map(r => `<li><span class="mono">${esc(r[0])}</span><q>${esc(r[1])}</q></li>`).join('')}</ul>
</section>
<section id="brief">
  <div class="sect-h wrap"><h2>Вы заполняете бриф</h2><span class="mono">Как я работаю</span></div>
  <div class="brief">
    <a class="wrap" href="${me.briefs[0][1]}" target="_blank" rel="noopener"><span class="mono">Бриф 01 · Google Forms</span><span><b>Коммерческий проект</b><span class="go" style="margin-top:18px">Открыть бриф <i><span>→</span></i></span></span></a>
    <a class="wrap" href="${me.briefs[1][1]}" target="_blank" rel="noopener"><span class="mono">Бриф 02 · Google Forms</span><span><b>Гражданская инициатива</b><span class="go" style="margin-top:18px">Открыть бриф <i><span>→</span></i></span></span></a>
  </div>
</section>`;
}

function blocks(p) {
  return p.blocks.map(b => {
    const [t, a, c] = b;
    if (t === 'h') return `<div class="sec ${a ? '' : 'nonum'}">${a ? `<div class="num"><em>${a}</em></div>` : ''}<h2>${esc(c)}</h2></div>`;
    if (t === 'h3') return `<h3>${esc(a)}</h3>`;
    if (t === 'p') return `<p>${esc(a)}</p>`;
    if (t === 'lead') return `<div class="stmt"><p>${esc(a)}</p></div>`;
    if (t === 'list') return `<ul class="li">${a.map(x => `<li><div>${x[0] ? `<b>${esc(x[0])}</b>` : ''}${esc(x[1])}</div></li>`).join('')}</ul>`;
    if (t === 'img') return `<figure class="fig full">${im(a, c)}<figcaption>${esc(c)}</figcaption></figure>`;
    if (t === 'imgs') { const n = a.length === 3 ? 3 : 2, rows = []; for (let k = 0; k < a.length; k += n) rows.push(`<div class="grow">${a.slice(k, k + n).map(f => { const d = MV.dims[f] || [16, 9]; return `<div style="flex:${(d[0] / d[1]).toFixed(3)}">${im(f, c)}</div>`; }).join('')}</div>`); return `<figure class="full"><div class="grid">${rows.join('')}</div><figcaption>${esc(c)}</figcaption></figure>`; }
    if (t === 'figs') return `<div class="figs full n${a.length}">${a.map(f => `<figure>${im(f[0], f[1])}<b>${esc(f[1])}</b><p>${esc(f[2])}</p></figure>`).join('')}</div>`;
    if (t === 'metrics') return `<div class="mt">${a.map(m => `<div><strong>${esc(m[0])}</strong><b>${esc(m[1])}</b><p>${esc(m[2])}</p></div>`).join('')}</div>`;
    if (t === 'ba') return `<div class="ba full">${a.map(x => `<div><div class="pair"><div><span>ДО</span>${im(x[0], 'До')}</div><span class="ar">→</span><div><span>ПОСЛЕ</span>${im(x[1], 'После')}</div></div><p>${esc(x[2])}</p></div>`).join('')}</div>`;
    return '';
  }).join('');
}

function kase(p) {
  const i = P.indexOf(p), nx = P[(i + 1) % P.length];
  return `
<article style="${apal(p)}">
  <header class="chd ${size(p.name)}"><div class="wrap">
    <div class="top mono"><a href="#works" data-sec>← Все работы</a><span>${nn(i)} / 06</span></div>
    <h1>${nm(p.name)}</h1>
    <p class="sub">${esc(p.title)}</p>
    <dl class="meta">
      <div><dt>Объём работ</dt><dd>${p.scope.map(esc).join('<br>')}</dd></div>
      <div><dt>Заказчик</dt><dd>${esc(p.kind)}</dd></div>
      <div><dt>Формат</dt><dd>${esc(p.category)}</dd></div>
      <div><dt>Роль · год</dt><dd>${esc(p.role)}<br>${p.year}</dd></div>
    </dl>
  </div></header>
  <div class="cover">${im(p.cover, p.name)}</div>
  <div class="body wrap"><div class="g">
    <div class="lead0"><span class="mono">О проекте</span><p>${esc(p.lead)}</p></div>
    ${blocks(p)}
  </div></div>
  <a class="next ${size(nx.name)}" href="#${nx.id}" style="${pal(nx)}"><div class="wrap">
    <div class="top mono"><span>Следующий проект</span><span>${nn(P.indexOf(nx))} / 06</span></div>
    <h3>${nm(nx.name)}</h3><span class="go">Смотреть кейс <i>→</i></span>
  </div></a>
</article>`;
}

function footer() {
  return `<footer class="ft"><div class="in wrap"><b>${me.name}</b><a href="${me.telegram[1]}" target="_blank" rel="noopener">Telegram ${me.telegram[0]}</a><span class="mono" style="text-transform:none;user-select:all">${me.email}</span><span class="r">Если вам подходит такой взгляд на дизайн, давайте обсудим ваш проект.</span></div></footer>`;
}

function fit() {
  document.querySelectorAll('[data-fit]').forEach(el => {
    el.style.fontSize = '100px';
    const w = el.parentElement.clientWidth, sw = el.getBoundingClientRect().width;
    if (sw) el.style.fontSize = (100 * w / sw * .995) + 'px';
  });
}
/* Русская типографика: неразрывные пробелы после коротких предлогов и союзов,
   перед тире и частицами, между числом и словом, короткое последнее слово — вместе с предыдущим. */
const NB = ' ', LET = 'А-Яа-яЁёA-Za-z0-9';
const PRE = new RegExp(`(^|[^${LET}\\-])([А-Яа-яЁё]{1,3})\\s+`, 'g');
function typo(s) {
  if (!/\S\s+\S/.test(s)) return s;
  s = s.replace(/\s+([—–])(?=\s)/g, NB + '$1');
  for (let k = 0; k < 2; k++) s = s.replace(PRE, (m, a, w) => a + w + NB);
  s = s.replace(new RegExp(`\\s+(бы|б|же|ж|ли)(?![${LET}])`, 'gi'), NB + '$1');
  s = s.replace(/(\d)\s+(?=[А-Яа-яЁёA-Za-z])/g, '$1' + NB);
  return s.replace(new RegExp(`([^\\s${NB}])[ \\t\\n]+([${LET}]{1,5}[.,;:!?»)]*)([ \\t\\n]*)$`), '$1' + NB + '$2$3');
}
function typoTree(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => { const t = typo(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
}
const SECS = ['works', 'about', 'reviews', 'brief'];
let pending = null;
function route() {
  const h = location.hash.slice(1), p = P.find(x => x.id === h), app = document.getElementById('app');
  const isSec = SECS.includes(h);
  if (p) { app.innerHTML = kase(p) + footer(); scrollTo(0, 0); }
  else {
    if (!app.dataset.home) app.innerHTML = home() + footer();
    fit(); bindShapes();
    const t = isSec ? h : pending; pending = null;
    if (t) requestAnimationFrame(() => document.getElementById(t)?.scrollIntoView()); else if (!isSec) scrollTo(0, 0);
  }
  app.dataset.home = p ? '' : '1'; theme(p);
  typoTree(document.body); fit();
  document.title = (p ? p.name + ' — ' : '') + 'Воронов';
}
function bindShapes() {
  const cap = document.getElementById('cap'); if (!cap) return; const def = cap.innerHTML;
  document.querySelectorAll('.sh').forEach(a => {
    const p = P[+a.dataset.i];
    const on = () => { cap.innerHTML = `<span class="mono">${nn(+a.dataset.i)} / 06 · ${esc(p.kind)}</span><b>${esc(p.name)}</b><span>${esc(p.title)}</span>`; typoTree(cap); };
    a.onmouseenter = a.onfocus = on; a.onmouseleave = a.onblur = () => { cap.innerHTML = def; typoTree(cap); };
  });
}
document.getElementById('tbtn').onclick = () => { dark = !dark; try { localStorage.setItem('mv-theme', dark ? 'dark' : 'light'); } catch (e) {} theme(P.find(x => x.id === location.hash.slice(1))); };
const ov = document.getElementById('ov'), mb = document.getElementById('mbtn');
mb.onclick = () => { ov.hidden = false; mb.setAttribute('aria-expanded', 'true'); };
document.getElementById('mclose').onclick = () => { ov.hidden = true; mb.setAttribute('aria-expanded', 'false'); };
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-sec]'); if (!a) return;
  ov.hidden = true;
  const id = a.getAttribute('href').slice(1);
  if (location.hash.slice(1) === id) { e.preventDefault(); document.getElementById(id)?.scrollIntoView(); }
});
addEventListener('hashchange', route); addEventListener('resize', fit);
route(); document.fonts?.ready.then(fit);
</script>
</body>
